[project]
name = "repower"
version = "0.1.0"
description = "Tokyo power market analysis bot – TEPCO supply/demand, JEPX spot prices, fuel drivers, news sentiment"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=3",
    "sqlalchemy>=2.0",
    "feedparser>=6.0",
    "yfinance>=1",
    "typer>=0.12",
    "streamlit>=1.36",
    "plotly>=6",
    "python-dotenv>=1.0",
    "huggingface-hub>=1.8,<3",  # hf_sync uses the 1.x API; cap the major
    "curl_cffi>=0.7",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "beautifulsoup4>=4.12",
    "lxml>=6",
    "pillow>=12.3",  # security floor for a transitive dep (8 advisories fixed in 12.3.0)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pymupdf>=1.24"]
policy = ["notebooklm-py[browser]>=0.7.3,<1", "pymupdf>=1.24"]
# Reads PDF text to find the page a digest citation is on (policy/citations.py). AGPL-3.0, so it is
# installed only where citations are resolved — the policy workflow and the local web-api — never in
# the Space image or the Pages build.
pdf = ["pymupdf>=1.24"]
# Headless browser used only to mint AWS WAF clearance tokens (meti.go.jp).
# Needs `playwright install chromium` after pip install.
browser = ["playwright>=1.44"]

[project.scripts]
repower = "repower.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# Type-check with 3.12 syntax: numpy's stubs use PEP 695 aliases, which 3.11 mode rejects outright
# (the runtime floor stays 3.11 via requires-python and ruff's target-version).
python_version = "3.12"
ignore_missing_imports = true
files = ["src/repower"]
check_untyped_defs = true
strict_equality = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer CLIs use function-call defaults (typer.Option/Argument) by design; keep B008 off
# here so a ruff-version change in how it special-cases Typer never breaks CI.
"src/repower/cli.py" = ["B008"]
# Embedded HTML/CSS/JS chart templates: long template-literal lines, not reflowable code.
"src/repower/dashboard/components/*_chart.py" = ["E501"]
# Long Japanese UI translation strings (and the bilingual command copy); splitting them harms grep-ability.
"src/repower/dashboard/i18n.py" = ["E501"]
"src/repower/commands.py" = ["E501"]
# Scraped-HTML fixtures with long real-world lines.
"tests/test_energy_board.py" = ["E501"]
"tests/test_policy_catalog.py" = ["E501"]
