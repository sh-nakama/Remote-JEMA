[project]
name = "repower"
version = "0.1.0"
description = "Tokyo power market analysis bot – TEPCO supply/demand, JEPX spot prices, fuel drivers, news sentiment"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "feedparser>=6.0",
    "yfinance>=0.2",
    "typer[all]>=0.12",
    "streamlit>=1.36",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.23",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
repower = "repower.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
