name: Daily Scrape & Analyze

on:
  schedule:
    # 20:30 UTC = 05:30 JST
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run only: continue from an empty DB if the HF pull fails (overwrites the dataset)"
        type: boolean
        default: false

# Everything here writes to Hugging Face with its own token; GITHUB_TOKEN only reads the repo.
permissions:
  contents: read

# All workflows that pull/push the shared HF dataset queue behind one group so
# two runs can never race on the DB (last push-hf wins silently otherwise).
# queue: max — the default single pending slot would silently *evict* a queued
# run when a third cron stacks up (e.g. Sunday: weekly-backfill → daily → policy).
concurrency:
  group: hf-dataset
  cancel-in-progress: false
  queue: max

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Runs take 8-15 min; without a cap a hung scrape holds the shared hf-dataset
    # queue for GitHub's 6-hour default.
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e . -c constraints.txt

      - name: Pull latest DB from Hugging Face
        run: python -m repower.cli pull-hf
        # Only an explicit bootstrap may scrape into an empty DB: pushing it would
        # replace the dataset's history. Scheduled runs have no inputs, so they fail hard.
        continue-on-error: ${{ inputs.bootstrap == true }}

      - name: Run full pipeline
        # months-back 1 = current + previous month only. Conditional-GET caching
        # (ETag/Last-Modified, persisted in the synced DB) means unchanged files
        # 304-skip, so the daily run is incremental at the file level. The weekly
        # workflow re-validates a deeper window to catch late upstream revisions.
        run: python -m repower.cli run-all --months-back 1

      - name: Prune stale HTTP cache entries
        # The cache table is synced to Hugging Face, so without eviction it grows
        # forever — every URL ever fetched, including superseded month/year files.
        # Dropping an entry only costs one unconditional re-fetch, never data, and
        # anything the scrapers still request is re-touched every run.
        run: python -m repower.cli cache prune --days 90

      - name: Push updated DB to Hugging Face
        run: python -m repower.cli push-hf

      - name: Check data freshness
        # After the push, so fresh sources still land. Scrapers fail soft, so without this
        # an upstream break is a green run with 0 rows; stale data now fails the run.
        run: python -m repower.cli check-freshness

      - name: Alert on failure
        if: failure()
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Daily scrape pipeline failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Daily scrape pipeline failed — $url\"}" || true
          fi
