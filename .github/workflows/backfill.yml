name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest YYYY-MM month to fetch"
        required: true
        default: "2024-04"
      area:
        description: "Area slug (or 'all')"
        required: true
        default: "all"
      bootstrap:
        description: "First run only: continue from an empty DB if the HF pull fails (overwrites the dataset)"
        type: boolean
        default: false

# Everything here writes to Hugging Face with its own token; GITHUB_TOKEN only reads the repo.
permissions:
  contents: read

# Queue behind the other HF-dataset-mutating workflows (see daily.yml).
concurrency:
  group: hf-dataset
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Pull existing DB from Hugging Face
        run: python -m repower.cli pull-hf
        # Only an explicit bootstrap may backfill into an empty DB: pushing it would
        # replace the dataset's history.
        continue-on-error: ${{ inputs.bootstrap == true }}

      - name: Run backfill
        # Inputs go through env: spliced into the script, a crafted value would run as shell.
        env:
          SINCE: ${{ inputs.since }}
          AREA: ${{ inputs.area }}
        run: python -m repower.cli backfill --since "$SINCE" --area "$AREA"

      - name: Push refreshed DB to Hugging Face
        run: python -m repower.cli push-hf

      - name: Alert on failure
        if: failure()
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Historical backfill failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Historical backfill failed — $url\"}" || true
          fi
