name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest YYYY-MM month to fetch"
        required: true
        default: "2024-04"
      area:
        description: "Area slug (or 'all')"
        required: true
        default: "all"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Pull existing DB from Hugging Face (if any)
        run: python -m repower.cli pull-hf
        continue-on-error: true

      - name: Run backfill
        run: |
          python -m repower.cli backfill \
            --since "${{ inputs.since }}" \
            --area "${{ inputs.area }}"

      - name: Push refreshed DB to Hugging Face
        run: python -m repower.cli push-hf
