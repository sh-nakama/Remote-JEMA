name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest YYYY-MM month to fetch"
        required: true
        default: "2024-04"
      area:
        description: "Area slug (or 'all')"
        required: true
        default: "all"

# Queue behind the other HF-dataset-mutating workflows (see daily.yml).
concurrency:
  group: hf-dataset
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Pull existing DB from Hugging Face (if any)
        run: python -m repower.cli pull-hf
        continue-on-error: true

      - name: Run backfill
        run: |
          python -m repower.cli backfill \
            --since "${{ inputs.since }}" \
            --area "${{ inputs.area }}"

      - name: Push refreshed DB to Hugging Face
        run: python -m repower.cli push-hf

      - name: Alert on failure
        if: failure()
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Historical backfill failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Historical backfill failed — $url\"}" || true
          fi
