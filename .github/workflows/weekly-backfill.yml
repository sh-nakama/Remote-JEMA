name: Weekly Deep Re-validation

# The daily job only fetches the current + previous month (months-back 1). TSOs
# (and JEPX) sometimes finalize/revise older months after first publishing them.
# This weekly job re-validates a deeper window so those late revisions are
# picked up. Thanks to conditional-GET caching (ETag/Last-Modified persisted in
# the synced DB), unchanged files 304-skip — so this stays cheap.

on:
  schedule:
    # Sundays 19:30 UTC = Mondays 04:30 JST (an hour before the daily run)
    - cron: "30 19 * * 0"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run only: continue from an empty DB if the HF pull fails (overwrites the dataset)"
        type: boolean
        default: false

# Everything here writes to Hugging Face with its own token; GITHUB_TOKEN only reads the repo.
permissions:
  contents: read

# Queue behind the other HF-dataset-mutating workflows (see daily.yml). On Sundays
# this job's 90-min window used to overlap the 20:30 daily run — now they queue.
concurrency:
  group: hf-dataset
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # first run warms the cache (cold); later runs 304-skip
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e . -c constraints.txt

      - name: Pull latest DB from Hugging Face
        run: python -m repower.cli pull-hf
        # Only an explicit bootstrap may backfill into an empty DB: pushing it would
        # replace the dataset's history. Scheduled runs have no inputs, so they fail hard.
        continue-on-error: ${{ inputs.bootstrap == true }}

      - name: Compute backfill window
        id: window
        run: |
          echo "since=$(date -u -d '6 months ago' +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "jepx_since=$(date -u -d '1 year ago' +%Y)" >> "$GITHUB_OUTPUT"

      - name: Deep re-validation backfill
        # Re-fetch the last ~6 months of TSO data, the last ~2 years of JEPX, and
        # all EPRX fiscal years. Conditional-GET caching means unchanged files
        # are 304-skipped; only late-revised data is re-downloaded + re-upserted.
        run: >
          python -m repower.cli backfill
          --since ${{ steps.window.outputs.since }}
          --jepx-since ${{ steps.window.outputs.jepx_since }}
          --eprx-since 2025

      - name: Push updated DB to Hugging Face
        run: python -m repower.cli push-hf

      - name: Alert on failure
        if: failure()
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Weekly deep re-validation failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Weekly deep re-validation failed — $url\"}" || true
          fi
