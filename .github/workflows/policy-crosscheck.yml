name: Monthly Committee Cross-check

# Cross-checks the committees the energy-board.xvps.jp aggregator surfaces against
# our own catalog and *accumulates* any energy committees we don't yet track into
# the catalog as discovered / untracked rows. Monthly (only the aggregator's recent
# feed is visible, so snapshots accumulate coverage over time). No auth. It pulls the
# catalog, diffs + persists newcomers, posts the report to the webhook, then pushes
# the updated DB back so the newly-discovered committees stick (and reach the web
# export). Locally, run `repower policy crosscheck`.

on:
  schedule:
    # 22:00 UTC on the 1st = 07:00 JST on the 2nd, monthly.
    - cron: "0 22 1 * *"
  workflow_dispatch:

# Queue behind the other HF-dataset-mutating workflows (see daily.yml).
concurrency:
  group: hf-dataset
  cancel-in-progress: false
  queue: max

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Pull latest DB from Hugging Face (for the current catalog)
        run: python -m repower.cli pull-hf
        # A scheduled run must not cross-check against a fresh DB and push it
        # over the dataset's history; manual dispatch may (bootstrap).
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Cross-check energy-board vs our catalog (accumulates discovered rows)
        run: python -m repower.cli policy crosscheck --notify

      - name: Push updated DB back to Hugging Face
        # No continue-on-error: persisting the discovered committees *is* the job —
        # a failed push must fail the run (and trigger the alert), not report green.
        run: python -m repower.cli push-hf

      - name: Alert on failure
        if: failure()
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Monthly committee cross-check failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Monthly committee cross-check failed — $url\"}" || true
          fi
