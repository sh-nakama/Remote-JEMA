name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: No brand trace
        # Every tracked path and file; the needle is split so this file carries no trace.
        run: |
          needle="au""rora"
          if git ls-files | grep -i -- "$needle"; then echo "brand trace in a path"; exit 1; fi
          # Test the output, not the status: xargs exits 123 when any one batch has no match.
          hits=$(git ls-files -z | grep -zvx 'CLAUDE.md' | xargs -0 grep -il -- "$needle" || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "brand trace found"; exit 1; fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install package + dev tools
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (type-clean modules; see [tool.mypy] exclude)
        run: mypy

      - name: Pytest
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint (hook dependency rules)
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # The date parsers exist to be timezone-independent, so a UTC-only run would prove nothing.
      - name: Unit tests (UTC and JST)
        run: |
          TZ=UTC npm test
          TZ=Asia/Tokyo npm test
