name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: No brand trace
        run: |
          if grep -ri "aurora" src space; then echo "brand trace found"; exit 1; fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        run: pytest -q
