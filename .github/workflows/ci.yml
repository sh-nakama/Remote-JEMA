name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: No brand trace
        # Every tracked path and file; the needle is split so this file carries no trace.
        run: |
          needle="au""rora"
          if git ls-files | grep -i -- "$needle"; then echo "brand trace in a path"; exit 1; fi
          # Test the output, not the status: xargs exits 123 when any one batch has no match.
          hits=$(git ls-files -z | grep -zvx 'CLAUDE.md' | xargs -0 grep -il -- "$needle" || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "brand trace found"; exit 1; fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        run: pytest -q
