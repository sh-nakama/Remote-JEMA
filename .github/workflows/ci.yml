name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No brand trace
        # Every tracked path and file; the needle is split so this file carries no trace.
        run: |
          needle="au""rora"
          if git ls-files | grep -i -- "$needle"; then echo "brand trace in a path"; exit 1; fi
          # Test the output, not the status: xargs exits 123 when any one batch has no match.
          hits=$(git ls-files -z | grep -zvx 'CLAUDE.md' | xargs -0 grep -il -- "$needle" || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "brand trace found"; exit 1; fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package + dev tools
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint (hook dependency rules)
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # The date parsers exist to be timezone-independent, so a UTC-only run would prove nothing.
      - name: Unit tests (UTC and JST)
        run: |
          TZ=UTC npm test
          TZ=Asia/Tokyo npm test
