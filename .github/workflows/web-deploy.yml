name: Deploy Web (JEMA)

# Builds the JEMA web frontend with live snapshots and publishes it to GitHub
# Pages. The snapshots are generated at build time by `repower export-web` after
# pulling the latest DB from the Hugging Face dataset, so the deployed site is a
# self-contained static bundle (app + data/web/**) with no runtime server.
#
# The scheduled run is idempotent: it fingerprints the pulled DB and skips the
# rebuild + deploy when it matches the last-deployed one (so an unchanged HF
# dataset doesn't redeploy identical data). Pushes to main and manual dispatch
# always rebuild, since those imply the app/exporter changed.
#
# Prerequisites (one-time):
#   • Repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
#   • Repo secrets HF_TOKEN + HF_DATASET_REPO (same as the daily workflow) so the
#     build can pull the DB — required, since the wholesale/balancing/policy
#     exporters read it (only the capacity dataset is curated in-repo).
#
# Host note: this targets GitHub Pages. A project site is served under /<repo>/,
# so VITE_BASE defaults to that; set the repo variable VITE_BASE (e.g. "/" for a
# custom domain, or the Space path for an HF static Space) to retarget.

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC = 06:30 JST — ~1h after the daily data cron (daily.yml, 20:30 UTC)
    # pushes the refreshed DB (incl. the upcoming-meeting + detection snapshot) to
    # Hugging Face, so this rebuild picks up that day's data. Keeps the static site
    # (and the "Recent & Scheduled" strip) current without a manual redeploy.
    - cron: "30 21 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/repower/dashboard/**"
      - ".github/workflows/web-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
    outputs:
      # Whether we actually built + should deploy (see the change-detection step).
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python package
        run: pip install -e .

      - name: Pull latest DB from Hugging Face
        id: pull
        run: python -m repower.cli pull-hf
        # Bootstrap runs (push/dispatch, e.g. before secrets exist) may fall back
        # to the curated in-repo data; a *scheduled* run must not — it would
        # silently replace the live site with a near-empty one (and, because the
        # no-DB fingerprint is unique per run, redeploy it every day).
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Warn when building without the HF DB
        if: steps.pull.outcome == 'failure'
        run: echo "::warning::HF DB pull failed — building from curated in-repo data only (check HF_TOKEN / HF_DATASET_REPO)."

      # ---- Change detection: skip the daily rebuild when the HF DB is unchanged ----
      # Fingerprint the pulled DB. A `actions/cache` entry keyed on that fingerprint
      # acts as a "have I already deployed this exact DB?" marker: a cache hit means
      # unchanged. Pushes / manual dispatch always rebuild (code changed); only the
      # scheduled run skips on an unchanged DB. If the pull failed (no DB), the
      # fingerprint is unique so we always fall through and deploy the curated data.
      - name: Fingerprint the DB
        id: fp
        run: |
          if [ -f data/repower.db ]; then
            echo "fp=$(sha256sum data/repower.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "fp=nodb-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up last-deployed DB fingerprint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .dbfp
          key: web-deploy-dbfp-${{ steps.fp.outputs.fp }}

      - name: Decide whether to rebuild
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF DB unchanged since the last deploy — skipping rebuild."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export web snapshots
        if: steps.decide.outputs.changed == 'true'
        run: python -m repower.cli export-web --out web/public/data/web

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.changed == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.decide.outputs.changed == 'true'
        run: npm --prefix web ci

      - name: Build web (Vite)
        if: steps.decide.outputs.changed == 'true'
        run: npm --prefix web run build

      - name: Disable Jekyll processing
        if: steps.decide.outputs.changed == 'true'
        run: touch web/dist/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.changed == 'true'
        with:
          path: web/dist

      # Remember this DB fingerprint so the next scheduled run can skip an identical
      # rebuild. Only saved when the fingerprint is new (a cache miss), so re-saving
      # an existing key never errors.
      - name: Record deployed DB fingerprint
        if: steps.decide.outputs.changed == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.fp.outputs.fp }}" > .dbfp

      - uses: actions/cache/save@v4
        if: steps.decide.outputs.changed == 'true' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: .dbfp
          key: web-deploy-dbfp-${{ steps.fp.outputs.fp }}

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Web deploy build failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Web deploy build failed — $url\"}" || true
          fi

  deploy:
    needs: build
    # Skip when the build was skipped (scheduled run, HF DB unchanged) — no artifact.
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
