name: Daily Policy Summaries

# Detection runs daily (folded into the data pipeline's `run-all`). This separate
# job does the slow, *authenticated* NotebookLM summarisation and emits a digest. It has no
# schedule of its own: policy-gate.yml starts it when NotebookLM's 5-hour limit has cleared, up
# to 4 times per JST day, and the job checks that limit again itself. Each run mints a NotebookLM session from the NOTEBOOKLM_MASTER_TOKEN_JSON secret,
# then gates on `auth check --test`: if that fails (secret missing, token revoked) it alerts,
# pushes what detection found and then marks the run failed (never fabricating summaries),
# so a dead login cannot hide behind green runs.

on:
  workflow_dispatch:
    inputs:
      committee:
        description: "Committee key or 'all'"
        default: "all"
      max_per_run:
        description: "Max meetings to summarise this run"
        default: "12"
      bootstrap:
        description: "First run only: continue from an empty DB if the HF pull fails (overwrites the dataset)"
        type: boolean
        default: false

# Everything here writes to Hugging Face with its own token; GITHUB_TOKEN only reads the repo
# and this workflow's earlier runs.
permissions:
  contents: read
  actions: read

# Queue behind the other HF-dataset-mutating workflows (see daily.yml).
concurrency:
  group: hf-dataset
  cancel-in-progress: false
  queue: max

jobs:
  summarise:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      NOTEBOOKLM_TIER: ${{ vars.NOTEBOOKLM_TIER || 'standard' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[browser,pdf,policy]" -c constraints.txt
          # meti.go.jp answers every tokenless client with an AWS WAF challenge,
          # and only a real browser can mint the aws-waf-token that clears it.
          # The pip extras bring the playwright package but not the browser it
          # drives; without this, clearance degrades to {} and `policy detect`
          # sees a wall of 202s — quietly, since clearance failures are
          # non-fatal by design.
          playwright install --with-deps chromium

      - name: Pull latest DB from Hugging Face
        id: pull
        run: python -m repower.cli pull-hf
        # Only an explicit bootstrap may detect/summarise into an empty DB: pushing it
        # would replace the dataset's history. Scheduled runs have no inputs, so they fail hard.
        continue-on-error: ${{ inputs.bootstrap == true }}

      - name: Detect new meetings (no auth required)
        run: python -m repower.cli policy detect

      - name: Mint a NotebookLM session from the master token
        # A copied cookie snapshot is superseded by any other active client within minutes, so
        # the secret holds a master token, which does not rotate. Writing it to the profile
        # also lets the library re-mint if the cookies lapse mid-run; inline
        # NOTEBOOKLM_AUTH_JSON would bypass that, so it must stay unset in this job.
        # The check below decides the outcome, so a failure here does not end the run. Output
        # stays out of the log because this repo's run logs are public.
        env:
          NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          set +e
          if [ -z "$NOTEBOOKLM_MASTER_TOKEN_JSON" ]; then
            echo "::warning::The NOTEBOOKLM_MASTER_TOKEN_JSON secret is not set"
            exit 0
          fi
          umask 077
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NOTEBOOKLM_MASTER_TOKEN_JSON" > ~/.notebooklm/profiles/default/master_token.json
          unset NOTEBOOKLM_MASTER_TOKEN_JSON
          notebooklm auth refresh --quiet > /dev/null 2>&1
          echo "auth refresh exit code: $?"

      - name: Check NotebookLM auth
        id: auth
        run: |
          set +e
          notebooklm auth check --test --json > auth.json 2>/dev/null
          # Only these fields: the rest of auth.json names the account, and run logs are public.
          python -c "import json; d=json.load(open('auth.json')); print('status:', d.get('status'), 'checks:', d.get('checks'))" 2>/dev/null
          ok=$(python -c "import json; d=json.load(open('auth.json')); print('true' if d.get('status')=='ok' and d.get('checks',{}).get('token_fetch') else 'false')" 2>/dev/null || echo false)
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Check the 5-hour NotebookLM limit
        id: gate
        # Here as well as in policy-gate.yml so a run started by hand obeys it. If the check
        # itself fails, `due` stays unset and the run does not summarise.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_RUN_ID: ${{ github.run_id }}
        run: python src/repower/policy/run_gate.py

      - name: Summarise pending meetings + emit digest
        if: steps.auth.outputs.ok == 'true' && steps.gate.outputs.due == 'true'
        # Inputs go through env: spliced into the script, a crafted value would run as shell
        # in a job that holds the NotebookLM session.
        env:
          COMMITTEE: ${{ github.event.inputs.committee || 'all' }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '12' }}
        run: |
          started="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          python -m repower.cli policy resume
          python -m repower.cli policy run --committee "$COMMITTEE" --max-per-run "$MAX_PER_RUN"
          python -m repower.cli policy digest --since "$started"

      - name: Resolve citation pages for earlier meetings
        # Auth-free, so it runs even when the NotebookLM session is stale. New summaries
        # resolve their own citations at ingest; this drains the back-catalogue of digests
        # written before pages were tracked, a few meetings a day (each one re-downloads the
        # meeting's PDFs from a WAF-guarded host, and the summarise step above has already
        # spent part of today's budget). Resumable and budget-aware: it stops quietly when the
        # host blocks us, and a failure here must never fail the run or skip the push below.
        # Keep the condition in sync with the push step's: don't work on a DB whose pull failed.
        if: always() && (steps.pull.outcome == 'success' || inputs.bootstrap == true)
        continue-on-error: true
        run: python -m repower.cli policy resolve-citations --max-meetings 5

      - name: Alert when auth is stale (master token needs replacing)
        if: steps.auth.outputs.ok != 'true'
        run: |
          echo "::warning::NotebookLM sign-in failed — check the NOTEBOOKLM_MASTER_TOKEN_JSON secret (see the README's runbook), then re-run this workflow."
          if [ -n "$WEBHOOK_URL" ]; then
            # -f so an HTTP error counts as a failure; -s also keeps curl from printing the URL.
            curl -fs -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d '{"content":"⚠️ Daily policy summaries skipped: NotebookLM sign-in failed. Check the NOTEBOOKLM_MASTER_TOKEN_JSON secret."}' \
              || echo "::warning::The stale-auth webhook alert could not be sent"
          fi

      - name: Push updated DB to Hugging Face
        # Preserve DB state from the cheap detection step even when summarisation
        # fails — but never push a fresh DB created because the pull itself failed
        # (only an explicit bootstrap run may do that). Keep the bootstrap test in
        # sync with the pull step's continue-on-error.
        if: always() && (steps.pull.outcome == 'success' || inputs.bootstrap == true)
        # Retried: this is the only copy of the run's summaries, and they cost quota to redo.
        # A repeat is safe because each attempt uploads the whole database again.
        run: |
          set +e
          for attempt in 1 2 3; do
            python -m repower.cli push-hf
            [ $? -eq 0 ] && exit 0
            echo "::warning::push-hf failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          exit 1

      - name: Alert on failure
        if: failure()
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::Daily policy summaries failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -fs -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 Daily policy summaries failed — $url\"}" \
              || echo "::warning::The failure webhook alert could not be sent"
          fi

      - name: Mark the run failed when auth is stale
        # Last, so detection's results are pushed first and the step above does not post a
        # second alert. A green run here hid weeks of skipped summaries; red also triggers
        # GitHub's own failure email. web-deploy runs whatever this run's conclusion.
        if: steps.auth.outputs.ok != 'true'
        run: |
          echo "::error::NotebookLM sign-in failed, so nothing was summarised. Check the NOTEBOOKLM_MASTER_TOKEN_JSON secret (see the README's runbook)."
          exit 1
