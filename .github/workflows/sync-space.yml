name: Sync to HF Space

on:
  push:
    branches: [main]
    paths:
      # Only sync when code or Space config changes, not on DB/data changes
      - "space/**"
      - "src/repower/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/sync-space.yml"
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install huggingface-hub
        run: pip install --quiet huggingface-hub==1.8.0

      - name: Push code to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          # Space already exists as Docker SDK — just upload files.
          # Build deployment directory:
          #   space/* (app.py, requirements.txt, README.md, packages.txt)
          #   src/    (package source)
          #   Dockerfile  (used by HF Docker SDK)
          deploy = Path("/tmp/space-deploy")
          shutil.rmtree(deploy, ignore_errors=True)
          shutil.copytree("space", deploy)
          shutil.copytree("src", deploy / "src")
          shutil.copy("Dockerfile", deploy / "Dockerfile")
          shutil.copy("pyproject.toml", deploy / "pyproject.toml")

          api.upload_folder(
              folder_path=str(deploy),
              repo_id="nakama-s/repower",
              repo_type="space",
              commit_message="Sync from GitHub",
              ignore_patterns=["*.pyc", "__pycache__", "*.egg-info"],
          )
          print("Space synced successfully")
          EOF

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::HF Space sync failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 HF Space sync failed — $url\"}" || true
          fi
