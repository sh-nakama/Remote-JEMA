name: Sync to HF Space

on:
  push:
    branches: [main]
    paths:
      # Only sync when code or Space config changes, not on DB/data changes
      - "space/**"
      - "src/repower/**"
      - "pyproject.toml"
      - "constraints.txt"
      - "Dockerfile"
      - ".github/scripts/sync_space.py"
      - ".github/workflows/sync-space.yml"
  workflow_dispatch:

# Everything here writes to Hugging Face with its own token; GITHUB_TOKEN only reads the repo.
permissions:
  contents: read

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    # The script waits up to 30 minutes for the Space to rebuild.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install huggingface-hub
        run: pip install --quiet huggingface-hub -c constraints.txt

      - name: Push code to HF Space and wait for the rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/sync_space.py

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::HF Space sync failed — $url"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"content\":\"🔴 HF Space sync failed — $url\"}" || true
          fi
