version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Dependabot bumps one pin without re-resolving, so a major that a dependency caps just
    # fails to install. Drop each rule once the cap is lifted.
    ignore:
      # streamlit 1.64 requires websockets<17.
      - dependency-name: websockets
        update-types: ["version-update:semver-major"]
      # notebooklm-py 0.8.3 requires filelock<4.
      - dependency-name: filelock
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8 requires typescript <6.1; drop this once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR: the Pages actions only prove themselves on a real deploy, so they move together.
    groups:
      actions:
        patterns: ["*"]
